<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Art Generator by E L L A</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
</head>

<body>
  <div id="app-container">
    <div id="canvas-container"></div>
    <div id="control-panel">
      <h1>GEOM ASCII Generator v3.1</h1>
      <h3>by Ella Whit a.k.a @bright_lightart</h3>
      <h2>Controls:</h2>

      <div class="control-group">
        <label for="image-upload">Upload Image:</label>
        <input type="file" id="image-upload" accept="image/*">
      </div>

      <div class="control-group">
        <button id="reset-image">Reset to Default Image</button>
      </div>

      <div class="control-group">
        <button id="reset-settings">Reset All Settings</button>
      </div>
      
      <div id="color-extraction-message" style="display: none;">
        <p>ASCII Colors are being extracted from the image. Adjust other parameters as needed.</p>
      </div>

      <h3>ASCII Characters</h3>
      <div class="control-group vertical-slider">
        <label for="cf">Contrast:</label>
        <div class="slider-with-input">
          <input type="number" id="cf-value" class="value-input" min="0" max="150" value="55">
          <input type="range" id="cf" class="range-input" min="0" max="150" value="55">
        </div>
      </div>
      
      <div class="control-group vertical-slider">
        <label for="mp">Midpoint:</label>
        <div class="slider-with-input">
          <input type="number" id="mp-value" class="value-input" min="0" max="255" value="141">
          <input type="range" id="mp" class="range-input" min="0" max="255" value="141">
        </div>
      </div>

      <div class="control-group">
        <label for="density-input">Input Characters:</label>
        <input type="text" id="density-input" value="RRBZ21">
      </div>

      <div class="control-group">
        <label for="zero-slider">Append Zeros:</label>
        <input type="range" id="zero-slider" min="0" max="12" value="4">
        <span id="zero-value">4</span>
      </div>

      <div class="control-group">
        <label for="space-slider">Append Spaces:</label>
        <input type="range" id="space-slider" min="0" max="12" value="0">
        <span id="space-value">0</span>
      </div>

      <div class="control-group vertical-slider">
        <label for="columns">Number of Columns:</label>
        <div class="slider-with-input">
          <input type="number" id="columns-value" class="value-input" min="10" max="300" value="150">
          <input type="range" id="columns" class="range-input" min="10" max="300" value="150">
        </div>
      </div>

      <div class="control-group" id="background-controls">
        <h3>Background</h3>
      
        <div class="control-group">
          <label>Background Style</label>
      
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="bg-style-off" name="advanced-bg-mode" value="off" checked />
              <label for="bg-style-off">Flat Background</label>
            </div>
      
            <div class="radio-option">
              <input type="radio" id="bg-style-color-picker" name="advanced-bg-mode" value="colorPicker" />
              <label for="bg-style-color-picker">Gradient Pixels</label>
            </div>
      
            <div class="radio-option">
              <input type="radio" id="bg-style-hsl-offset" name="advanced-bg-mode" value="hslOffset" />
              <label for="bg-style-hsl-offset">Offset Pixels</label>
            </div>
          </div>
        </div>
      
        <label for="bg-color-input">Background colour</label>
        <input type="color" id="bg-color-input" />
      
        <label for="bg-alpha">Background alpha</label>
        <input type="range" id="bg-alpha" min="0" max="100" value="100" />
        <input type="number" id="bg-alpha-value" min="0" max="100" value="100" />
      
        <!-- Only shown when bg-style === "hslOffset" -->
        <div id="advanced-bg-hsl-offset-controls" style="display:none;">
          <h4>HSL offsets</h4>
      
          <label>
            Hue offset (°)
            <input type="range" id="h-offset" min="-180" max="180" value="0" />
            <input type="number" id="h-offset-value" min="-180" max="180" value="0" />
          </label>
      
          <label>
            Saturation offset
            <input type="range" id="s-offset" min="-100" max="100" value="0" />
            <input type="number" id="s-offset-value" min="-100" max="100" value="0" />
          </label>
      
          <label>
            Lightness offset
            <input type="range" id="l-offset" min="-100" max="100" value="0" />
            <input type="number" id="l-offset-value" min="-100" max="100" value="0" />
          </label>
        </div>
      </div>
      
      <h3>ASCII Colours</h3>
      <div class="control-group">
        <label for="color-extraction-toggle">Use Image Colors:</label>
        <input type="checkbox" id="color-extraction-toggle">
      </div>

      <!-- Image-colour glyph adjustments (visible only when Use Image Colors = ON) -->
      <div class="control-group" id="image-glyph-controls" style="display:none;">
        <label>Image Glyph Adjustments:</label>
      
        <div class="control-group">
          <label>Glyph Alpha:</label>
          <div class="slider-with-input">
            <input type="number" id="image-glyph-alpha-value" class="value-input" step="0.01" min="0" max="1" value="1">
            <input type="range" id="image-glyph-alpha" class="range-input" step="0.01" min="0" max="1" value="1">
          </div>
        </div>
      
        <div class="control-group">
          <label>HSL Offset (applied to extracted image colours):</label>
      
          <div class="slider-with-input">
            <label for="image-glyph-h">H</label>
            <input type="number" id="image-glyph-h-value" class="value-input" step="1" min="-180" max="180" value="0">
            <input type="range" id="image-glyph-h" class="range-input" step="1" min="-180" max="180" value="0">
          </div>
      
          <div class="slider-with-input">
            <label for="image-glyph-s">S</label>
            <input type="number" id="image-glyph-s-value" class="value-input" step="1" min="-100" max="100" value="0">
            <input type="range" id="image-glyph-s" class="range-input" step="1" min="-100" max="100" value="0">
          </div>
      
          <div class="slider-with-input">
            <label for="image-glyph-l">L</label>
            <input type="number" id="image-glyph-l-value" class="value-input" step="1" min="-100" max="100" value="0">
            <input type="range" id="image-glyph-l" class="range-input" step="1" min="-100" max="100" value="0">
          </div>
        </div>
      </div>

      <div class="control-group" id="color-count-group">
        <label>Number of Colors:</label>
        <div class="radio-group">
          <div class="radio-option">
            <input type="radio" id="color-count-1" name="color-count" value="1">
            <label for="color-count-1">1</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="color-count-2" name="color-count" value="2" checked>
            <label for="color-count-2">2</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="color-count-3" name="color-count" value="3">
            <label for="color-count-3">3</label>
          </div>
        </div>
      </div>

      <div class="control-group" id="char-color-pickers">

        <div id="char-start-picker" class="char-color-row">
          <div class="color-alpha-row">
            <label for="start-color-input">1</label>
            <input type="color" id="start-color-input" />
            <label for="start-alpha">Alpha</label>
            <input type="range" id="start-alpha" min="0" max="100" value="100" />
            <input type="number" id="start-alpha-value" min="0" max="100" value="100" />
          </div>
        </div>

        <div id="char-middle-picker" class="char-color-row">
          <div class="color-alpha-row">
            <label for="middle-color-input">2</label>
            <input type="color" id="middle-color-input" />
            <label for="middle-alpha">Alpha</label>
            <input type="range" id="middle-alpha" min="0" max="100" value="100" />
            <input type="number" id="middle-alpha-value" min="0" max="100" value="100" />
          </div>
        </div>

        <div id="char-end-picker" class="char-color-row">
          <div class="color-alpha-row">
            <label for="end-color-input">3</label>
            <input type="color" id="end-color-input" />
            <label for="end-alpha">Alpha</label>
            <input type="range" id="end-alpha" min="0" max="100" value="100" />
            <input type="number" id="end-alpha-value" min="0" max="100" value="100" />
          </div>
        </div>

      </div>

      <div class="control-group" id="lerp-control">
        <label>LERP:</label>
        <div class="radio-group">
          <div class="radio-option">
            <input type="radio" id="lerp-true" name="lerp" value="true" checked>
            <label for="lerp-true">True</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="lerp-false" name="lerp" value="false">
            <label for="lerp-false">False</label>
          </div>
        </div>
      </div>

      <h3>Shadows</h3>

      <!-- Shadow mode -->
      <div class="control-group" id="shadow-mode-group">
        <label>Shadow Mode:</label>
        <div class="radio-group">
          <div class="radio-option">
            <input type="radio" id="shadow-mode-off" name="shadow-mode" value="off" checked>
            <label for="shadow-mode-off">Off</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="shadow-mode-single" name="shadow-mode" value="single">
            <label for="shadow-mode-single">Single</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="shadow-mode-double" name="shadow-mode" value="double">
            <label for="shadow-mode-double">Double</label>
          </div>
        </div>
      </div>

      <!-- Everything below hidden when mode=off -->
      <div class="control-group" id="shadow-controls">

        <!-- Colour mode -->
        <div class="control-group" id="shadow-color-mode-group">
          <label>Shadow Colour Mode:</label>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="shadow-color-mode-offset" name="shadow-color-mode" value="offset" checked>
              <label for="shadow-color-mode-offset">Offset from main</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="shadow-color-mode-manual" name="shadow-color-mode" value="manual">
              <label for="shadow-color-mode-manual">Manual</label>
            </div>
          </div>
        </div>

        <!-- Double only -->
        <div class="control-group" id="shadow-symmetric-group">
          <label class="checkbox-row">
            <input type="checkbox" id="shadow-symmetric" checked>
            Double shadow is symmetric
          </label>
        </div>

        <!-- Shared -->
        <div class="control-group">
          <label>Shadow Alpha Multiplier:</label>
          <div class="slider-with-input">
            <input type="number" id="shadow-alpha-mult-value" class="value-input" step="0.01" min="0" max="1" value="0.6">
            <input type="range" id="shadow-alpha-mult" class="range-input" step="0.01" min="0" max="1" value="0.6">
          </div>
        </div>

        <!-- ========================= -->
        <!-- Shadow 1 group -->
        <!-- ========================= -->
        <div class="control-group shadow-layer" id="shadow1-group">
          <h4>Shadow 1</h4>

          <!-- Geometry -->
          <div class="control-group">
            <label>Offset (cell):</label>
            <div class="slider-with-input">
              <label for="shadow-dx">X</label>
              <input type="number" id="shadow-dx-value" class="value-input" step="0.01" min="-1" max="1" value="0.15">
              <input type="range" id="shadow-dx" class="range-input" step="0.01" min="-1" max="1" value="0.15">
            </div>
            <div class="slider-with-input">
              <label for="shadow-dy">Y</label>
              <input type="number" id="shadow-dy-value" class="value-input" step="0.01" min="-1" max="1" value="0.10">
              <input type="range" id="shadow-dy" class="range-input" step="0.01" min="-1" max="1" value="0.10">
            </div>
          </div>

          <!-- Offset mode -->
          <div class="control-group" id="shadow-offset-controls">
            <label>Colour Offset:</label>
            <div class="slider-with-input">
              <label for="shadow-h">H</label>
              <input type="number" id="shadow-h-value" class="value-input" step="1" min="-180" max="180" value="20">
              <input type="range" id="shadow-h" class="range-input" step="1" min="-180" max="180" value="20">
            </div>
            <div class="slider-with-input">
              <label for="shadow-s">S</label>
              <input type="number" id="shadow-s-value" class="value-input" step="1" min="-100" max="100" value="10">
              <input type="range" id="shadow-s" class="range-input" step="1" min="-100" max="100" value="10">
            </div>
            <div class="slider-with-input">
              <label for="shadow-l">L</label>
              <input type="number" id="shadow-l-value" class="value-input" step="1" min="-100" max="100" value="-10">
              <input type="range" id="shadow-l" class="range-input" step="1" min="-100" max="100" value="-10">
            </div>
          </div>

          <!-- Manual mode -->
          <div class="control-group" id="shadow-manual-controls">
            <label>Colour:</label>
            <div class="color-alpha-row">
              <input type="color" id="shadow1-color" value="#ff0050">
              <input type="range" id="shadow1-alpha" min="0" max="100" value="60">
              <input type="number" id="shadow1-alpha-value" min="0" max="100" value="60">
            </div>
          </div>
        </div>

        <!-- ========================= -->
        <!-- Shadow 2 group -->
        <!-- ========================= -->
        <div class="control-group shadow-layer" id="shadow2-group">
          <h4>Shadow 2</h4>

          <!-- Geometry (Double + NOT symmetric only) -->
          <div class="control-group" id="shadow-offset-2-panel">
            <label>Offset (cell):</label>
            <div class="slider-with-input">
              <label for="shadow-dx2">X</label>
              <input type="number" id="shadow-dx2-value" class="value-input" step="0.01" min="-1" max="1" value="-0.15">
              <input type="range" id="shadow-dx2" class="range-input" step="0.01" min="-1" max="1" value="-0.15">
            </div>
            <div class="slider-with-input">
              <label for="shadow-dy2">Y</label>
              <input type="number" id="shadow-dy2-value" class="value-input" step="0.01" min="-1" max="1" value="-0.10">
              <input type="range" id="shadow-dy2" class="range-input" step="0.01" min="-1" max="1" value="-0.10">
            </div>
          </div>

          <!-- Offset colour controls (Offset mode + Double + NOT symmetric only) -->
          <div class="control-group" id="shadow-offset-2-color-panel">
            <label>Colour Offset:</label>
            <div class="slider-with-input">
              <label for="shadow-h2">H</label>
              <input type="number" id="shadow-h2-value" class="value-input" step="1" min="-180" max="180" value="-20">
              <input type="range" id="shadow-h2" class="range-input" step="1" min="-180" max="180" value="-20">
            </div>
            <div class="slider-with-input">
              <label for="shadow-s2">S</label>
              <input type="number" id="shadow-s2-value" class="value-input" step="1" min="-100" max="100" value="10">
              <input type="range" id="shadow-s2" class="range-input" step="1" min="-100" max="100" value="10">
            </div>
            <div class="slider-with-input">
              <label for="shadow-l2">L</label>
              <input type="number" id="shadow-l2-value" class="value-input" step="1" min="-100" max="100" value="-10">
              <input type="range" id="shadow-l2" class="range-input" step="1" min="-100" max="100" value="-10">
            </div>
          </div>

          <!-- Manual colour controls (Double + Manual only) -->
          <div class="control-group" id="shadow2-manual-row">
            <label>Colour:</label>
            <div class="color-alpha-row">
              <input type="color" id="shadow2-color" value="#00c8ff">
              <input type="range" id="shadow2-alpha" min="0" max="100" value="60">
              <input type="number" id="shadow2-alpha-value" min="0" max="100" value="60">
            </div>
          </div>
        </div>

      </div>

      <h3>Save File</h3>
      <div class="control-group">
        <label for="png-width">PNG Width:</label>
        <input type="number" id="png-width" min="1" value="900">
        <button id="download-png" class="download-button">Download PNG</button>
      </div>

    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
